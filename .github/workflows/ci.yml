name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: tests (py${{ matrix.python }}, ${{ matrix.deps }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        deps: [full, minimal]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # The minimal job is not a shortcut - it is the configuration a low-spec
      # district deployment actually runs, where XGBoost/LightGBM/SHAP are absent
      # and the platform falls back to its bundled NumPy gradient booster and
      # exact TreeSHAP. Both paths have to stay green.
      - name: Install (full)
        if: matrix.deps == 'full'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ml,dev,dashboard]"

      - name: Install (minimal - no ML wheels)
        if: matrix.deps == 'minimal'
        run: |
          python -m pip install --upgrade pip
          pip install -e .          # core only: no ML wheels at all
          pip install pytest pytest-cov httpx

      - name: Report the resolved backend
        run: |
          python -c "
          from src.models.backends import backend_report
          import json; print(json.dumps(backend_report(), indent=2))"

      - name: Run tests
        run: pytest -q --cov=src --cov=offline --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python == '3.11' && matrix.deps == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - run: ruff check src config dashboard offline scripts tests
      - run: ruff format --check src config dashboard offline scripts
        continue-on-error: true

  config-validation:
    name: disease configs and registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e "."
      # Every shipped disease must satisfy the platform contract: >=3 fused
      # sources, a stated mechanism per proxy, distinct thresholds, and a
      # response template per severity.
      - name: Validate every disease
        run: |
          python - <<'PY'
          import sys
          from src.core.config_loader import load_all_disease_configs, validate_disease_config
          from src.models.registry import validate_registry

          failed = False
          for slug, config in load_all_disease_configs().items():
              problems = validate_disease_config(config)
              status = "OK" if not problems else "FAIL"
              print(f"{status:4} {slug:16} {len(config.required_sources)} sources")
              for problem in problems:
                  print(f"       - {problem}")
              failed |= bool(problems)

          registry_problems = validate_registry()
          if registry_problems:
              failed = True
              print("\nregistry problems:", registry_problems)
          sys.exit(1 if failed else 0)
          PY

  notebooks:
    name: notebooks execute
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]" jupyter nbconvert matplotlib
      # The notebooks import the real codebase rather than re-implementing it,
      # so an execution failure here means src/ changed behaviour.
      - name: Execute notebooks
        env:
          MPLBACKEND: Agg
        run: |
          for nb in notebooks/0*.ipynb; do
            echo "::group::$nb"
            jupyter nbconvert --to notebook --execute "$nb" \
              --ExecutePreprocessor.timeout=1800 --output /tmp/out.ipynb
            echo "::endgroup::"
          done

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate the compose file
        run: docker compose config --quiet
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: afya-predict:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Acceptance criterion #14: the stack must come up in one command, on a
      # machine with no credentials configured.
      - name: Boot the API and check /health
        run: |
          docker run -d --name afya-api -p 8000:8000 afya-predict:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          python -c "
          import json
          health = json.load(open('/tmp/health.json'))
          assert health['status'] in ('ok', 'degraded'), health
          assert len(health['diseases']) >= 5, health['diseases']
          assert health['districts'] > 50, health['districts']
          print('API booted with', len(health['diseases']), 'diseases and',
                health['districts'], 'districts')"
          docker rm -f afya-api

  backtest:
    name: acceptance backtest
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[ml,dev]"
      # Critical rule #10: a model that cannot beat all three naive baselines is
      # not fit for deployment. run_backtest.py exits non-zero when that happens.
      - name: Walk-forward backtest
        run: |
          python scripts/run_backtest.py \
            --disease malaria \
            --districts Kinondoni Ilala "Mwanza City" Sengerema \
            --history-weeks 260 --max-folds 3 \
            --json artifacts/backtest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-report
          path: artifacts/backtest.json

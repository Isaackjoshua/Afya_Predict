# Tanzania region/council reference grid.
#
# Spatial unit  : administrative council (district level)
# Temporal unit : ISO-8601 epidemiological week
#
# Centroids are APPROXIMATE (degrees, WGS84) and populations are approximate
# 2022-census-era figures rounded to the nearest thousand. They are good enough
# for gravity-model connectivity and for per-1,000 incidence rates; swap in an
# authoritative shapefile + census extract for operational deployment by
# pointing `boundaries.geojson_path` at it.
region:
  name: "Tanzania"
  code: "TZ"
  iso3: "TZA"
  timezone: "Africa/Dar_es_Salaam"
  epi_week_system: "iso8601"
  crs: "EPSG:4326"

boundaries:
  admin_level: "council"
  geojson_path: "data/raw/boundaries/tanzania_councils.geojson"  # optional
  # When the GeoJSON is absent the system builds connectivity from the
  # centroid + population table below (haversine distance gravity model).

climate:
  # Bounding box used when subsetting global rasters/reanalysis.
  bbox: { west: 29.3, south: -11.8, east: 40.5, north: -0.9 }

defaults:
  reporting_completeness: 0.939   # national DHIS2 completeness (shortcoming #14)
  weather_stations: 50            # sparse ground network (shortcoming #7)


[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "afya-predict"
version = "0.1.0"
description = "AI-powered fusion of digital proxy data streams for predictive disease intelligence in East Africa and beyond"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AFYA-PREDICT contributors" }]
keywords = ["epidemiology", "outbreak-prediction", "one-health", "tanzania", "public-health"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "numpy>=1.24,<2",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "xgboost>=2.0",
  "lightgbm>=4.0",
  "statsmodels>=0.14",
  "shap>=0.44",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "PyYAML>=6.0",
  "fastapi>=0.109",
  "uvicorn[standard]>=0.27",
  "requests>=2.31",
  "APScheduler>=3.10",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.31", "plotly>=5.18"]
geo = ["geopandas>=0.14", "rasterio>=1.3", "xarray>=2024.1", "netCDF4>=1.6"]
db = ["psycopg[binary]>=3.1", "SQLAlchemy>=2.0", "redis>=5.0"]
notify = ["twilio>=8.12"]
trends = ["pytrends>=4.9"]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "httpx>=0.26", "ruff>=0.2", "hypothesis>=6.98"]
all = ["afya-predict[dashboard,geo,db,notify,trends,dev]"]

[project.scripts]
afya = "src.cli:main"

[project.urls]
Homepage = "https://github.com/Isaackjoshua/Afya_Predict"
Repository = "https://github.com/Isaackjoshua/Afya_Predict"

[tool.setuptools.packages.find]
include = ["src*", "config*", "dashboard*", "offline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.coverage.run]
source = ["src", "offline"]
omit = ["*/__init__.py", "*/adapters/search_trends.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
